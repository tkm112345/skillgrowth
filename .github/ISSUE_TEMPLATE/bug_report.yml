name: Bug report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skillgrowth version
      description: Shown in Settings → About.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How are you running skillgrowth?
      options:
        - docker compose (default)
        - Local dev (uvicorn + Vite)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Backend logs (`docker compose logs app`) or browser console output,
        if applicable.
      render: shell
