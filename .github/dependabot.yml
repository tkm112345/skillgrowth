version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # mcp>=2.0 broke fastapi-mcp 0.4.0's Server(name, description) call
      # (description became keyword-only) — see requirements.txt's comment
      # on the mcp pin. Dependabot already re-proposed this bump once after
      # it was reverted; keep it from proposing it again until fastapi-mcp
      # catches up.
      - dependency-name: "mcp"
        versions: [">=2.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
